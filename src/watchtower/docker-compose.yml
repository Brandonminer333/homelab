# Watchtower — image updates + git-sync for compose file / config updates.
#
# Watchtower: polls registries and recreates containers when images change.
#   Only containers with label com.centurylinklabs.watchtower.enable=true
#   are updated (--label-enable). Add that label to stacks you want auto-bumped.
#   Image-update notifications go to ntfy topic `homelab` on the homelab network.
#
# git-sync: polls origin, fast-forward pulls on new commits, then syncs every
#   other stack to src/watchtower/config.yml (down if run != true; up or
#   force-recreate if run:true). Script is read from the bind mount so pulls
#   update sync logic. This stack is never torn down by itself. One ntfy on
#   update lists starting/restarting stacks; failures notify separately.
#
# Before first up:
#   cp .env.example .env   # set HOMELAB_PATH to the host clone path
#   # Private HTTPS remotes: ensure the host clone can already fetch, or mount
#   # SSH keys (uncomment volumes below).
#   # Bring up src/ntfy first so notifications have somewhere to go.
#
# Start:
#   cd src/watchtower && docker compose up -d --build

services:
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # containrrr/watchtower defaults to API 1.25; Docker Engine ≥20.10 needs ≥1.40.
      DOCKER_API_VERSION: "1.40"
      # Notify on image updates via self-hosted ntfy (HTTP on the homelab net).
      # SKIP_TITLE keeps the ?title= query param from being overwritten.
      WATCHTOWER_NOTIFICATIONS: shoutrrr
      WATCHTOWER_NOTIFICATION_SKIP_TITLE: "true"
      WATCHTOWER_NOTIFICATION_URL: ntfy://ntfy/homelab?scheme=http&title=Watchtower&tags=whale
    # Hourly; cleanup old images; only labeled containers.
    command: --interval 3600 --label-enable --cleanup
    networks:
      - homelab
    # Do not let Watchtower restart itself.
    labels:
      - com.centurylinklabs.watchtower.enable=false

  git-sync:
    build: .
    image: homelab-git-sync:local
    container_name: git-sync
    restart: unless-stopped
    environment:
      REPO_DIR: /homelab
      GIT_BRANCH: ${GIT_BRANCH:-main}
      POLL_INTERVAL: ${POLL_INTERVAL:-300}
      # Stack enable/disable: src/watchtower/config.yml only (public, in-repo).
      # Internal publish URL (container name on the homelab network).
      NTFY_URL: ${NTFY_URL:-http://ntfy/homelab}
    volumes:
      # Host clone (read-write so git pull updates files Docker Compose uses)
      - ${HOMELAB_PATH:?set HOMELAB_PATH in .env}:/homelab
      - /var/run/docker.sock:/var/run/docker.sock
      # Uncomment for private repos over SSH (deploy key or host key):
      # - /home/branflakes/.ssh:/root/.ssh:ro
    networks:
      - homelab
    labels:
      - com.centurylinklabs.watchtower.enable=false

networks:
  homelab:
    external: true
