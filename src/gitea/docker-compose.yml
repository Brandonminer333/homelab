# Gitea — self-hosted Git with PostgreSQL.
#
# Fill in before first `docker compose up`:
#   1. cp .env.example .env
#   2. Set POSTGRES_PASSWORD (and optionally GITEA admin via first-run UI)
#
# Layout (host paths under src/gitea/):
#   ./data     → Gitea app data, repos, config (read-write)
#   ./postgres → PostgreSQL data (read-write)
#
# Access (nginx reverse proxy on Tailscale hostname):
#   https://lenovoflakes.tail62b305.ts.net:8446/
#
#   Gitea HTTP listens on the homelab Docker network only (no host publish).
#   nginx terminates TLS and proxies :8446 → gitea:3000.
#
# Git over SSH (direct Tailscale publish, not via nginx):
#   ssh://git@lenovoflakes.tail62b305.ts.net:2222/<user>/<repo>.git
#
# Start:
#   cd src/gitea && docker compose up -d

services:
  # Unique service name so it does not collide with nextcloud's `db` on homelab.
  gitea-db:
    image: postgres:16-alpine
    container_name: gitea-db
    restart: unless-stopped
    environment:
      TZ: America/Los_Angeles
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: gitea
      # Subdir so ./postgres/.gitkeep does not block initdb on an empty mount.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./postgres:/var/lib/postgresql/data
    networks:
      - homelab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea"]
      interval: 10s
      timeout: 5s
      retries: 5

  gitea:
    image: gitea/gitea:1.26.4
    container_name: gitea
    restart: unless-stopped
    depends_on:
      gitea-db:
        condition: service_healthy
    environment:
      TZ: America/Los_Angeles
      USER_UID: ${PUID:-1000}
      USER_GID: ${PGID:-1000}
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${POSTGRES_PASSWORD}
      GITEA__server__DOMAIN: lenovoflakes.tail62b305.ts.net
      GITEA__server__SSH_DOMAIN: lenovoflakes.tail62b305.ts.net
      GITEA__server__ROOT_URL: https://lenovoflakes.tail62b305.ts.net:8446/
      GITEA__server__HTTP_PORT: 3000
      GITEA__server__SSH_PORT: 2222
      GITEA__server__DISABLE_SSH: "false"
      GITEA__server__START_SSH_SERVER: "true"
      # Behind nginx TLS; honor X-Forwarded-* from the proxy.
      GITEA__server__PROTOCOL: http
    volumes:
      - ./data:/data
    ports:
      # Git SSH — HTTP goes through nginx on the homelab network
      - "2222:22"
    networks:
      - homelab
    labels:
      - com.centurylinklabs.watchtower.enable=true

networks:
  homelab:
    external: true
