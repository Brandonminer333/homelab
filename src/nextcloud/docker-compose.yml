# src/nextcloud/docker-compose.yml
services:
  nextcloud-db:
    image: postgres:16-alpine
    container_name: nextcloud-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
    volumes:
      - ../../data/nextcloud/db:/var/lib/postgresql/data
    networks:
      - nextcloud-internal

  nextcloud:
    image: nextcloud:apache
    container_name: nextcloud
    restart: unless-stopped
    depends_on:
      - nextcloud-db
    environment:
      POSTGRES_HOST: nextcloud-db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_DOMAIN}
      OVERWRITEPROTOCOL: https
    volumes:
      - ../../data/nextcloud/app:/var/www/html
      - ./hooks:/docker-entrypoint-hooks.d
    networks:
      - nextcloud-internal
      - homelab   # shared with nginx reverse proxy

  collabora:
    image: collabora/code:latest
    container_name: collabora
    restart: unless-stopped
    environment:
      - domain=${COLLABORA_DOMAIN}
      - extra_params=--o:ssl.enable=false --o:ssl.termination.enable=true
    cap_add:
      - MKNOD
    networks:
      - homelab

networks:
  homelab:
    external: true
    