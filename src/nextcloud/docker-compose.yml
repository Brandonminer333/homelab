# Nextcloud — self-hosted file drive + calendars/contacts (CalDAV/CardDAV).
# Collabora Online (CODE) is the in-browser editor (Nextcloud Office / richdocuments).
#
# Fill in before first `docker compose up`:
#   1. cp .env.example .env
#   2. Set NEXTCLOUD_DB_PASSWORD (openssl rand -base64 24)
#   3. Set NEXTCLOUD_ADMIN_USER / NEXTCLOUD_ADMIN_PASSWORD — first admin account.
#      These are read on the first start only; afterwards use
#      `docker exec -u www-data nextcloud php occ user:resetpassword USER`
#   4. If data/nextcloud/db still has MariaDB files from the old stack, wipe it.
#      Postgres will refuse to start on a MySQL datadir.
#
# Layout:
#   ../../data/nextcloud/html → Nextcloud source, config, apps (/var/www/html)
#   ../../data/nextcloud/data → user files (/var/www/data, outside the webroot)
#   ../../data/nextcloud/db   → Postgres data files
#
# html/ carries no .gitkeep on purpose: the entrypoint rsyncs the release over
# /var/www/html with --delete, which would remove the tracked file and leave the
# server's clone permanently dirty. Docker creates the bind source on first up.
#
# Access (nginx reverse proxy on Tailscale hostname):
#   https://lenovoflakes.tail62b305.ts.net:8444/  Nextcloud
#   https://lenovoflakes.tail62b305.ts.net:8448/  Collabora Online
#
#   Nextcloud and Collabora listen on the homelab Docker network only (no host
#   publish). nginx terminates TLS and proxies :8444 → nextcloud:80,
#   :8448 → collabora:9980. db and redis stay on nextcloud-internal.
#
# Calendars / contacts (Apple Calendar, DAVx⁵, Thunderbird):
#   https://lenovoflakes.tail62b305.ts.net:8444/remote.php/dav
#   nginx serves the /.well-known/{caldav,carddav} redirects for auto-discovery.
#
# Collabora (Nextcloud Office) — after the first start:
#   docker exec -u www-data nextcloud php occ app:enable richdocuments
#   Then Admin → Nextcloud Office → Use your own server:
#     https://lenovoflakes.tail62b305.ts.net:8448
#   extra_hosts below lets both containers reach that public URL via host nginx
#   (WOPI callbacks cannot use the Docker-internal name).
#
# Start:
#   cd src/nextcloud && docker compose up -d

services:
  nextcloud:
    # Track 34.x patches; a major bump needs `occ upgrade` and app compatibility checks.
    image: nextcloud:34-apache
    container_name: nextcloud
    restart: unless-stopped
    extra_hosts:
      - "lenovoflakes.tail62b305.ts.net:host-gateway"
    environment:
      TZ: America/Los_Angeles
      POSTGRES_HOST: nextcloud-db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?Set NEXTCLOUD_DB_PASSWORD in .env}
      # Redis backs distributed file locking; without it concurrent sync clients
      # trip "file is locked" errors.
      REDIS_HOST: redis
      REDIS_HOST_PORT: 6379
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:?Set NEXTCLOUD_ADMIN_USER in .env}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?Set NEXTCLOUD_ADMIN_PASSWORD in .env}
      # Space-separated, applied at install time only. Matches on hostname (no
      # port); "nextcloud" keeps in-network probes (Homepage siteMonitor,
      # healthcheck) off the untrusted-domain error page.
      NEXTCLOUD_TRUSTED_DOMAINS: lenovoflakes.tail62b305.ts.net nextcloud localhost
      # Read at install time only; keeps user files out of the webroot.
      NEXTCLOUD_DATA_DIR: /var/www/data
      # Public host:port behind nginx — Nextcloud builds absolute links from these.
      OVERWRITEHOST: lenovoflakes.tail62b305.ts.net:8444
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: https://lenovoflakes.tail62b305.ts.net:8444
      # nginx reaches us from the homelab bridge; trust it for X-Forwarded-*.
      TRUSTED_PROXIES: 172.16.0.0/12
      PHP_MEMORY_LIMIT: 1G
      PHP_UPLOAD_LIMIT: 10G
      # 0 disables Apache's LimitRequestBody so large library uploads are not cut off.
      APACHE_BODY_LIMIT: 0
    volumes:
      - ../../data/nextcloud/html:/var/www/html
      - ../../data/nextcloud/data:/var/www/data
      - ./hooks:/docker-entrypoint-hooks.d
    depends_on:
      nextcloud-db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/status.php || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - homelab
      - nextcloud-internal
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # Background jobs every 5 minutes. Nextcloud's AJAX cron only fires on page
  # loads, which starves file scans and dav cleanup on an idle instance.
  cron:
    image: nextcloud:34-apache
    container_name: nextcloud-cron
    restart: unless-stopped
    extra_hosts:
      - "lenovoflakes.tail62b305.ts.net:host-gateway"
    entrypoint: /cron.sh
    environment:
      TZ: America/Los_Angeles
    volumes:
      - ../../data/nextcloud/html:/var/www/html
      - ../../data/nextcloud/data:/var/www/data
    depends_on:
      nextcloud:
        condition: service_started
    networks:
      - homelab
      - nextcloud-internal
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # Collabora Online (CODE) — Nextcloud Office backend.
  # Browsers hit it via nginx :8448; WOPI is locked to the Nextcloud public URL.
  collabora:
    image: collabora/code:latest
    container_name: collabora
    restart: unless-stopped
    extra_hosts:
      - "lenovoflakes.tail62b305.ts.net:host-gateway"
    environment:
      TZ: America/Los_Angeles
      aliasgroup1: "https://lenovoflakes.tail62b305.ts.net:8444"
      server_name: "lenovoflakes.tail62b305.ts.net:8448"
      DONT_GEN_SSL_CERT: "true"
      extra_params: "--o:ssl.enable=false --o:ssl.termination=true --o:logging.level=warning"
      dictionaries: en_US
    cap_add:
      - MKNOD
    networks:
      - homelab
    labels:
      - com.centurylinklabs.watchtower.enable=true

  nextcloud-db:
    image: postgres:16-alpine
    container_name: nextcloud-db
    restart: unless-stopped
    environment:
      TZ: America/Los_Angeles
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?Set NEXTCLOUD_DB_PASSWORD in .env}
    volumes:
      - ../../data/nextcloud/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - nextcloud-internal
    labels:
      - com.centurylinklabs.watchtower.enable=true

  redis:
    image: redis:8-alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    # Locking and cache only — nothing here needs to survive a restart.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    environment:
      TZ: America/Los_Angeles
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - nextcloud-internal
    labels:
      - com.centurylinklabs.watchtower.enable=true

networks:
  homelab:
    external: true
  nextcloud-internal:
    name: nextcloud-internal
