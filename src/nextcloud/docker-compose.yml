# Nextcloud — files / sync; database is shared MariaDB (src/mariadb).
#
# Prerequisites:
#   1. Shared MariaDB is up and healthy (cd src/mariadb && docker compose up -d)
#   2. NEXTCLOUD_DB_PASSWORD in this .env matches src/mariadb/.env
#
# TODO: switch this stack from Postgres env vars to MariaDB (MYSQL_*/mariadb:3306).
# See src/mariadb/README.md.
#
# Access (nginx reverse proxy on Tailscale hostname):
#   https://lenovoflakes.tail62b305.ts.net:8444/
#
# Start:
#   cd src/nextcloud && docker compose up -d

services:
  nextcloud:
    image: nextcloud:30-apache
    container_name: nextcloud
    restart: unless-stopped
    networks:
      - homelab
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?Set NEXTCLOUD_DB_PASSWORD in .env}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS}
      # Served behind nginx on its own HTTPS port (no subpath).
      OVERWRITEPROTOCOL: https
      OVERWRITEHOST: lenovoflakes.tail62b305.ts.net:8444
      OVERWRITECLIURL: https://lenovoflakes.tail62b305.ts.net:8444
      # nginx reaches this container over the homelab network; trust that subnet
      # so Nextcloud honors X-Forwarded-* headers. Set to the actual homelab
      # subnet (docker network inspect homelab) if it differs.
      TRUSTED_PROXIES: ${NEXTCLOUD_TRUSTED_PROXIES:-172.16.0.0/12}
    volumes:
      - /opt/nextcloud/html:/var/www/html
      - /opt/nextcloud/data:/var/www/html/data
    labels:
      - com.centurylinklabs.watchtower.enable=true

networks:
  homelab:
    external: true
