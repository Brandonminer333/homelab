# Shared MariaDB — one RDBMS for Nextcloud, Forgejo, and ONLYOFFICE.
#
# Fill in before first `docker compose up`:
#   1. cp .env.example .env
#   2. Set MARIADB_ROOT_PASSWORD and each *_DB_PASSWORD (openssl rand -base64 32)
#   3. Copy the matching app passwords into each app's .env
#
# Layout (host paths under src/mariadb/):
#   ./data → MariaDB data directory (read-write)
#   ./init → first-boot user/database bootstrap (read-only)
#
# Network: listens on the homelab Docker network only (no host publish).
#   Apps reach it as hostname `mariadb` on port 3306.
#
# Init scripts run only when ./data has no existing cluster (first boot).
# To re-run init: stop the stack, wipe ./data (except .gitkeep), start again.
#
# Start (before app stacks that depend on it):
#   cd src/mariadb && docker compose up -d

services:
  mariadb:
    image: mariadb:latest
    container_name: mariadb
    restart: unless-stopped
    environment:
      TZ: America/Los_Angeles
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
      # Consumed by ./init/01-create-app-dbs.sh on first boot only.
      NEXTCLOUD_DB_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?Set NEXTCLOUD_DB_PASSWORD in .env}
      FORGEJO_DB_PASSWORD: ${FORGEJO_DB_PASSWORD:?Set FORGEJO_DB_PASSWORD in .env}
      ONLYOFFICE_DB_PASSWORD: ${ONLYOFFICE_DB_PASSWORD:?Set ONLYOFFICE_DB_PASSWORD in .env}
    volumes:
      - ./data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro
    networks:
      - homelab
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - com.centurylinklabs.watchtower.enable=true

networks:
  homelab:
    external: true
