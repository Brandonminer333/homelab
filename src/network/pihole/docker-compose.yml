# Pi-hole — DNS + admin UI on the homelab Docker network.
#
# Admin UI (via nginx): https://lenovoflakes.tail62b305.ts.net:8445/admin/
# DNS (port 53) is not proxied; publish it on the host if this box is your resolver.

services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    networks:
      - homelab
    environment:
      TZ: America/Los_Angeles
      WEBPASSWORD: ${WEBPASSWORD}
    volumes:
      - ./pihole/etc-pihole:/etc/pihole
      - ./pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    restart: unless-stopped

networks:
  homelab:
    external: true