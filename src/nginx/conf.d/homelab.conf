# ---------------------------------------------------------------------------
# Vaultwarden at :8447
# ---------------------------------------------------------------------------
server {
    listen 8447 ssl;
    listen [::]:8447 ssl;
    http2 on;
    server_name lenovoflakes.tail62b305.ts.net;

    ssl_certificate     /etc/nginx/certs/lenovoflakes.tail62b305.ts.net.crt;
    ssl_certificate_key /etc/nginx/certs/lenovoflakes.tail62b305.ts.net.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Vaultwarden attachments (default max ~500 MiB)
    client_max_body_size 525M;

    location / {
        proxy_pass http://vaultwarden:80/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # WebSocket notifications (same port since Vaultwarden 1.29+)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
