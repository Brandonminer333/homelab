# Port-based reverse proxy for the Tailscale hostname.
# TLS is terminated here with the Tailscale-issued cert (mounted read-only at
# /etc/nginx/certs). Upstreams are reached over the external "homelab" Docker
# network by container name (Rule of Truth: container == src-level dir name).
#
#   https://lenovoflakes.tail62b305.ts.net/       landing
#   https://lenovoflakes.tail62b305.ts.net:8443/  Jellyfin
#   https://lenovoflakes.tail62b305.ts.net:8444/  Nextcloud
#   https://lenovoflakes.tail62b305.ts.net:8445/  Pi-hole (/admin)
#   https://lenovoflakes.tail62b305.ts.net:8446/  Gitea
#   https://lenovoflakes.tail62b305.ts.net:8447/  Vaultwarden
#   http://localhost:8080/                        qBittorrent (SSH tunnel)
#   http://localhost:9696/                        Prowlarr (SSH tunnel)

# Plain HTTP -> HTTPS (landing)
server {
    listen 80;
    listen [::]:80;
    server_name lenovoflakes.tail62b305.ts.net;

    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# Landing page at :443
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lenovoflakes.tail62b305.ts.net;

    ssl_certificate     /etc/nginx/certs/lenovoflakes.tail62b305.ts.net.crt;
    ssl_certificate_key /etc/nginx/certs/lenovoflakes.tail62b305.ts.net.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location = / {
        default_type text/html;
        return 200 '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Homelab</title>\n<style>body{font-family:system-ui,sans-serif;background:#111;color:#eee;display:flex;min-height:100vh;margin:0;align-items:center;justify-content:center}main{text-align:center}h1{font-weight:600;letter-spacing:.02em}a{display:inline-block;margin:.4rem;padding:.7rem 1.4rem;border:1px solid #444;border-radius:.6rem;color:#eee;text-decoration:none}a:hover{background:#222}</style>\n</head>\n<body>\n<main>\n<h1>Homelab</h1>\n<a href="https://lenovoflakes.tail62b305.ts.net:8443/">Jellyfin</a>\n<a href="https://lenovoflakes.tail62b305.ts.net:8444/">Nextcloud</a>\n<a href="https://lenovoflakes.tail62b305.ts.net:8445/admin/">Pi-hole</a>\n<a href="https://lenovoflakes.tail62b305.ts.net:8446/">Gitea</a>\n<a href="https://lenovoflakes.tail62b305.ts.net:8447/">Vaultwarden</a>\n<a href="http://localhost:8080/">qBittorrent</a>\n<a href="http://localhost:9696/">Prowlarr</a>\n</main>\n</body>\n</html>\n';
    }
}

# ---------------------------------------------------------------------------
# Jellyfin at :8443
# ---------------------------------------------------------------------------
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name lenovoflakes.tail62b305.ts.net;

    ssl_certificate     /etc/nginx/certs/lenovoflakes.tail62b305.ts.net.crt;
    ssl_certificate_key /etc/nginx/certs/lenovoflakes.tail62b305.ts.net.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://jellyfin:8096/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-Protocol $scheme;

        # WebSocket (live playback, session updates)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Disable buffering so streaming/transcoding is responsive
        proxy_buffering off;
    }
}

# ---------------------------------------------------------------------------
# Nextcloud at :8444
# ---------------------------------------------------------------------------
server {
    listen 8444 ssl;
    listen [::]:8444 ssl;
    http2 on;
    server_name lenovoflakes.tail62b305.ts.net;

    ssl_certificate     /etc/nginx/certs/lenovoflakes.tail62b305.ts.net.crt;
    ssl_certificate_key /etc/nginx/certs/lenovoflakes.tail62b305.ts.net.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Service discovery redirects (DAV) required by Nextcloud clients.
    location = /.well-known/carddav { return 301 /remote.php/dav; }
    location = /.well-known/caldav  { return 301 /remote.php/dav; }
    location = /.well-known/webfinger   { return 301 /index.php/.well-known/webfinger; }
    location = /.well-known/nodeinfo    { return 301 /index.php/.well-known/nodeinfo; }

    location / {
        proxy_pass http://nextcloud:80/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Large uploads / long-running sync operations
        client_max_body_size 10G;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;

        # Nextcloud recommends these
        proxy_hide_header X-Powered-By;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }
}

# ---------------------------------------------------------------------------
# Pi-hole at :8445 (UI lives at /admin; DNS on 53 is not proxied here)
# ---------------------------------------------------------------------------
server {
    listen 8445 ssl;
    listen [::]:8445 ssl;
    http2 on;
    server_name lenovoflakes.tail62b305.ts.net;

    ssl_certificate     /etc/nginx/certs/lenovoflakes.tail62b305.ts.net.crt;
    ssl_certificate_key /etc/nginx/certs/lenovoflakes.tail62b305.ts.net.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location = / {
        return 301 /admin/;
    }

    location / {
        proxy_pass http://pihole/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

