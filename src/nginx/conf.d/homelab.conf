        # WebSocket notifications (same port since Vaultwarden 1.29+)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# ---------------------------------------------------------------------------
# Collabora Online (LibreOffice) at :8448
# ---------------------------------------------------------------------------
server {
    listen 8448 ssl;
    listen [::]:8448 ssl;
    http2 on;
    server_name lenovoflakes.tail62b305.ts.net;

    ssl_certificate     /etc/nginx/certs/lenovoflakes.tail62b305.ts.net.crt;
