# Port-based reverse proxy for the Tailscale hostname.
# TLS is terminated here with the Tailscale-issued cert (mounted read-only at
# /etc/nginx/certs). Upstreams are reached over the external "homelab" Docker
# network by container name (Rule of Truth: container == src-level dir name).
#
# Homepage (:443) uses compile-time DNS so nginx will not start without it.
# All other apps resolve via Docker DNS (127.0.0.11) at request time — a
# torn-down container yields 502 on that port only, not a dead proxy.
#
#   https://lenovoflakes.tail62b305.ts.net/       Homepage
#   https://lenovoflakes.tail62b305.ts.net:8443/  Jellyfin
#   https://lenovoflakes.tail62b305.ts.net:8444/  Nextcloud (files + CalDAV/CardDAV)
#   https://lenovoflakes.tail62b305.ts.net:8445/  Pi-hole (/admin)
#   https://lenovoflakes.tail62b305.ts.net:8447/  Vaultwarden
#   https://lenovoflakes.tail62b305.ts.net:8448/  Euro-Office
#   http://localhost:8080/                        qBittorrent (SSH tunnel)
#   http://localhost:9696/                        Prowlarr (SSH tunnel)

# Plain HTTP -> HTTPS (Homepage)
server {
    listen 80;
    listen [::]:80;
    server_name lenovoflakes.tail62b305.ts.net;

    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# Homepage at :443 (compile-time resolve — landing page must be up)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lenovoflakes.tail62b305.ts.net;

    ssl_certificate     /etc/nginx/certs/lenovoflakes.tail62b305.ts.net.crt;
    ssl_certificate_key /etc/nginx/certs/lenovoflakes.tail62b305.ts.net.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://homepage:3000/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # WebSocket (live dashboard updates)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# ---------------------------------------------------------------------------
# Jellyfin at :8443
# ---------------------------------------------------------------------------
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name lenovoflakes.tail62b305.ts.net;

    ssl_certificate     /etc/nginx/certs/lenovoflakes.tail62b305.ts.net.crt;
    ssl_certificate_key /etc/nginx/certs/lenovoflakes.tail62b305.ts.net.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Docker embedded DNS — resolve at request time
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream jellyfin:8096;
        proxy_pass http://$upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-Protocol $scheme;

        # WebSocket (live playback, session updates)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Disable buffering so streaming/transcoding is responsive
        proxy_buffering off;
    }
}

# ---------------------------------------------------------------------------
# Nextcloud at :8444 (files, calendars, contacts)
# ---------------------------------------------------------------------------
server {
    listen 8444 ssl;
    listen [::]:8444 ssl;
    http2 on;
    server_name lenovoflakes.tail62b305.ts.net;

    ssl_certificate     /etc/nginx/certs/lenovoflakes.tail62b305.ts.net.crt;
    ssl_certificate_key /etc/nginx/certs/lenovoflakes.tail62b305.ts.net.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Unlimited so multi-GB uploads and chunked sync are not truncated here;
    # Nextcloud enforces its own quota (PHP_UPLOAD_LIMIT).
    client_max_body_size 0;

    # Nextcloud's admin security scan expects these; without them clients that
    # probe the bare hostname cannot find the DAV endpoints.
    location = /.well-known/carddav { return 301 /remote.php/dav/; }
    location = /.well-known/caldav  { return 301 /remote.php/dav/; }

    location / {
        set $upstream nextcloud:80;
        proxy_pass http://$upstream;

        # Prefer $http_host so :8444 is preserved for Nextcloud URL generation.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Large uploads / long-running sync and occ jobs
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 36000s;
        proxy_send_timeout 36000s;
        proxy_connect_timeout 60s;

        # WebSocket (Talk signaling, notify_push)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# ---------------------------------------------------------------------------
# Pi-hole at :8445 (UI lives at /admin; DNS on 53 is not proxied here)
# ---------------------------------------------------------------------------
server {
    listen 8445 ssl;
    listen [::]:8445 ssl;
    http2 on;
    server_name lenovoflakes.tail62b305.ts.net;

    ssl_certificate     /etc/nginx/certs/lenovoflakes.tail62b305.ts.net.crt;
    ssl_certificate_key /etc/nginx/certs/lenovoflakes.tail62b305.ts.net.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location = / {
        return 301 /admin/;
    }

    location / {
        set $upstream pihole;
        proxy_pass http://$upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------------
# Vaultwarden at :8447
# ---------------------------------------------------------------------------
server {
    listen 8447 ssl;
    listen [::]:8447 ssl;
    http2 on;
    server_name lenovoflakes.tail62b305.ts.net;

    ssl_certificate     /etc/nginx/certs/lenovoflakes.tail62b305.ts.net.crt;
    ssl_certificate_key /etc/nginx/certs/lenovoflakes.tail62b305.ts.net.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Vaultwarden attachments (default max ~500 MiB)
    client_max_body_size 525M;

    location / {
        set $upstream vaultwarden:80;
        proxy_pass http://$upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # WebSocket notifications (same port since Vaultwarden 1.29+)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# ---------------------------------------------------------------------------
# Euro-Office Document Server at :8448
# ---------------------------------------------------------------------------
server {
    listen 8448 ssl;
    listen [::]:8448 ssl;
    http2 on;
    server_name lenovoflakes.tail62b305.ts.net;

    ssl_certificate     /etc/nginx/certs/lenovoflakes.tail62b305.ts.net.crt;
    ssl_certificate_key /etc/nginx/certs/lenovoflakes.tail62b305.ts.net.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Large document uploads / conversions
    client_max_body_size 100M;

    location / {
        set $upstream euro-office:80;
        proxy_pass http://$upstream;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;

        # WebSocket (co-editing)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
    }
}