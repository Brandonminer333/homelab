# Navidrome — Subsonic-compatible music server over the shared music library.
#
# Fill in before first `docker compose up`:
#   1. cp .env.example .env   # PUID / PGID from `id -u` / `id -g` on the host
#   2. Create the data folder owned by that same user:
#        mkdir -p ../../data/navidrome
#        sudo chown -R "$(id -u):$(id -g)" ../../data/navidrome
#      Skipping this is the usual cause of a restart loop: Docker creates a
#      missing bind-mount source as root, Navidrome runs as PUID, cannot create
#      navidrome.db, and SQLite reports "unable to open database file".
#
# Mount points:
#   ../../data/navidrome              → DB, cache, transcoded artwork (read-write)
#   ../../data/jellyfin/media/music   → music library (read-only) → /music
#
#   Navidrome embeds SQLite — the DB is a file in /data, so there is no separate
#   database container (unlike the nextcloud stack).
#
#   The library is the same tree Jellyfin serves; Navidrome only ever reads it,
#   so both stacks can run at once. Tags live in the files — Navidrome writes
#   play counts, stars and playlists to its own DB, never to the media.
#
# Access (nginx reverse proxy on Tailscale hostname):
#   https://lenovoflakes.tail62b305.ts.net:8446/
#
#   Navidrome listens on the homelab Docker network only (no host publish).
#   nginx terminates TLS and proxies :8446 → navidrome:4533.
#   ND_BASEURL stays empty (served at root); set it only if this ever moves to
#   a subpath behind :443.
#
# Clients (Subsonic / OpenSubsonic apps — Symfonium, substreamer, play:Sub):
#   Server: https://lenovoflakes.tail62b305.ts.net:8446
#   The first account created via the web UI is the admin.
#
# Start:
#   cd src/navidrome && docker compose up -d

services:
  navidrome:
    image: deluan/navidrome:0.63.2
    container_name: navidrome
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: America/Los_Angeles
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      # Full rescan schedule (renamed from ND_SCANSCHEDULE in v0.55.0 — the old
      # name is ignored and silently disables periodic scans).
      # New files are picked up sooner than this by the filesystem watcher.
      ND_SCANNER_SCHEDULE: 24h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      # Transcoding profiles are editable in the UI only when this is true;
      # false keeps the defaults (and the config surface) locked down.
      ND_ENABLETRANSCODINGCONFIG: "false"
      ND_ENABLESHARING: "false"
      # Cover art and artist images from the filesystem; no external lookups
      # unless a Last.fm / Spotify key is added here.
      ND_COVERARTPRIORITY: cover.*, folder.*, front.*, embedded
    volumes:
      - ../../data/navidrome:/data
      - ../../data/jellyfin/media/music:/music:ro
    networks:
      - homelab
    labels:
      - com.centurylinklabs.watchtower.enable=true

networks:
  homelab:
    external: true
