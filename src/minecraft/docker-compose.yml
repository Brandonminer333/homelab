# Minecraft server (itzg/minecraft-server)
#
# Fill in before first `docker compose up`:
#   1. cp .env.example .env  and set WHITELIST (required for public access)
#   2. Optional: set VERSION to a pin (e.g. "1.21.8") instead of LATEST
#   3. Optional: change TYPE to PAPER / FABRIC / FORGE / etc.
#   4. Optional: MOTD, DIFFICULTY, MODE, MAX_PLAYERS below
#
# Layout:
#   ./mc-data → world saves, server.properties, logs (read-write)
#
# Access — Tailscale (private):
#   Multiplayer → Add Server: lenovoflakes.tail62b305.ts.net
#
# Access — public internet (port forward):
#   1. Reserve a LAN IP for this host on the router
#   2. Forward TCP 25565 → host:25565
#   3. Optional: Dynamic DNS (DuckDNS, etc.) for a stable hostname
#   4. Friends join: <public-ip-or-ddns>:25565
#   Keep WHITELIST set in .env so only known players can join.
#
#   Do NOT put Minecraft behind the nginx reverse proxy — it is TCP game
#   traffic, not HTTP.
#
# Ops:
#   docker compose up -d
#   docker compose logs -f minecraft
#   docker attach minecraft-server   # console (Ctrl-p Ctrl-q to detach)
#   whitelist add <name>             # from console, if managing live
#   docker compose down              # clean stop; allow stop_grace_period

services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-server
    restart: unless-stopped
    tty: true
    stdin_open: true
    stop_grace_period: 1m
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: VANILLA
      VERSION: LATEST
      MEMORY: 2G
      USE_AIKAR_FLAGS: "true"
      TZ: America/Los_Angeles
      UID: ${PUID:-1000}
      GID: ${PGID:-1000}
      MOTD: "Homelab Minecraft"
      DIFFICULTY: normal
      MODE: survival
      MAX_PLAYERS: 10
      ENABLE_RCON: "false"
      VIEW_DISTANCE: 10
      SIMULATION_DISTANCE: 8
      # Whitelist: set WHITELIST in .env (comma-separated usernames/UUIDs).
      # Setting WHITELIST enables white-list=true automatically.
      WHITELIST: ${WHITELIST:?Set WHITELIST in .env — see .env.example}
      ENFORCE_WHITELIST: "true"
      EXISTING_WHITELIST_FILE: SYNCHRONIZE
      OPS: ${OPS:-}
    volumes:
      - ./mc-data:/data
