# Immich — self-hosted photos (bundled Postgres + Valkey).
#
# Based on Immich v3.1.0 official compose:
#   https://github.com/immich-app/immich/releases/download/v3.1.0/docker-compose.yml
#
# Fill in before first `docker compose up`:
#   1. cp .env.example .env
#   2. Set DB_PASSWORD (A-Za-z0-9 only)
#   3. Confirm EXTERNAL_LIBRARY_PATH points at your Seafile desktop sync of Photos
#
# Layout:
#   ../../data/immich/library          → Immich uploads / generated assets
#   ../../data/immich/postgres         → bundled Immich Postgres (vectorchord)
#   ${EXTERNAL_LIBRARY_PATH} (ro)      → Seafile-synced Photos → /mnt/seafile-photos
#
# Access (nginx reverse proxy on Tailscale hostname):
#   https://lenovoflakes.tail62b305.ts.net:8449/
#
# After first login, add an External Library for the Seafile folder:
#   Administration → Libraries → External → path /mnt/seafile-photos → Scan
#
# Start:
#   cd src/immich && docker compose up -d

name: immich

services:
  immich-server:
    container_name: immich
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3}
    restart: unless-stopped
    volumes:
      - ${UPLOAD_LOCATION:-../../data/immich/library}:/data
      - ${EXTERNAL_LIBRARY_PATH:?Set EXTERNAL_LIBRARY_PATH in .env}:/mnt/seafile-photos:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      TZ: America/Los_Angeles
    depends_on:
      - redis
      - database
    networks:
      - homelab
      - immich-internal
    labels:
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3}
    restart: unless-stopped
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    environment:
      TZ: America/Los_Angeles
    networks:
      - immich-internal
    labels:
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping || exit 1
    networks:
      - immich-internal

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # Uncomment if the DB disk is HDD rather than SSD:
      # DB_STORAGE_TYPE: HDD
    volumes:
      - ${DB_DATA_LOCATION:-../../data/immich/postgres}:/var/lib/postgresql/data
    shm_size: 128mb
    networks:
      - immich-internal
    healthcheck:
      disable: false

volumes:
  model-cache:

networks:
  homelab:
    external: true
  immich-internal:
    driver: bridge
