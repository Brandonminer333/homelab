# Seafile CE — files / sync; database is shared MariaDB (src/mariadb).
#
# Prerequisites:
#   1. Shared MariaDB is up and healthy (cd src/mariadb && docker compose up -d)
#   2. SEAFILE_DB_PASSWORD in this .env matches src/mariadb/.env
#   3. INIT_SEAFILE_MYSQL_ROOT_PASSWORD matches MARIADB_ROOT_PASSWORD (first boot)
#
# See src/mariadb/README.md.
#
# Layout:
#   /opt/seafile-data → Seafile shared volume (config + libraries)
#
# Access (nginx reverse proxy on Tailscale hostname):
#   https://lenovoflakes.tail62b305.ts.net:8444/
#
# Start (after shared MariaDB):
#   cd src/seafile && docker compose up -d

services:
  memcached:
    image: memcached:1.6.29
    container_name: seafile-memcached
    restart: unless-stopped
    entrypoint: memcached -m 256
    networks:
      - seafile-internal
    labels:
      - com.centurylinklabs.watchtower.enable=true

  seafile:
    image: seafileltd/seafile-mc:12.0-latest
    container_name: seafile
    restart: unless-stopped
    depends_on:
      - memcached
    environment:
      TIME_ZONE: America/Los_Angeles
      # Shared MariaDB (pre-created DBs/user — see src/mariadb/init).
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_USER: seafile
      DB_PASSWORD: ${SEAFILE_DB_PASSWORD:?Set SEAFILE_DB_PASSWORD in .env}
      DB_ROOT_PASSWD: ${INIT_SEAFILE_MYSQL_ROOT_PASSWORD:?Set INIT_SEAFILE_MYSQL_ROOT_PASSWORD in .env (same as MARIADB_ROOT_PASSWORD)}
      SEAFILE_MYSQL_DB_HOST: mariadb
      SEAFILE_MYSQL_DB_PORT: "3306"
      SEAFILE_MYSQL_DB_USER: seafile
      SEAFILE_MYSQL_DB_PASSWORD: ${SEAFILE_DB_PASSWORD:?Set SEAFILE_DB_PASSWORD in .env}
      SEAFILE_MYSQL_DB_CCNET_DB_NAME: ccnet_db
      SEAFILE_MYSQL_DB_SEAFILE_DB_NAME: seafile_db
      SEAFILE_MYSQL_DB_SEAHUB_DB_NAME: seahub_db
      # Public URL (nginx TLS on :8444)
      SEAFILE_SERVER_HOSTNAME: ${SEAFILE_SERVER_HOSTNAME:-lenovoflakes.tail62b305.ts.net:8444}
      SEAFILE_SERVER_PROTOCOL: https
      SITE_ROOT: /
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?Set JWT_PRIVATE_KEY in .env (pwgen -s 40 1)}
      INIT_SEAFILE_ADMIN_EMAIL: ${INIT_SEAFILE_ADMIN_EMAIL:?Set INIT_SEAFILE_ADMIN_EMAIL in .env}
      INIT_SEAFILE_ADMIN_PASSWORD: ${INIT_SEAFILE_ADMIN_PASSWORD:?Set INIT_SEAFILE_ADMIN_PASSWORD in .env}
      ENABLE_SEADOC: "false"
      SEAFILE_LOG_TO_STDOUT: "true"
      NON_ROOT: "false"
    volumes:
      - /opt/seafile-data:/shared
    networks:
      - homelab
      - seafile-internal
    labels:
      - com.centurylinklabs.watchtower.enable=true

networks:
  homelab:
    external: true
  seafile-internal:
    driver: bridge
