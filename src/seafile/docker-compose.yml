# Seafile CE — self-hosted file drive (Seafile 13 + MariaDB + Redis).
#
# Fill in before first `docker compose up`:
#   1. cp .env.example .env
#   2. Set SEAFILE_MYSQL_DB_PASSWORD and INIT_SEAFILE_MYSQL_ROOT_PASSWORD (openssl rand -base64 24)
#   3. Set JWT_PRIVATE_KEY (openssl rand -hex 32)
#   4. Set INIT_SEAFILE_ADMIN_EMAIL / INIT_SEAFILE_ADMIN_PASSWORD — first admin account.
#      INIT_* values are read on the first start only; afterwards use
#      `docker exec -it seafile /opt/seafile/seafile-server-latest/reset-admin.sh`
#
# Layout:
#   ../../data/seafile/shared   → Seafile conf, libraries, logs (/shared in the container)
#   ../../data/seafile/mariadb  → MariaDB data files
#
# Access (nginx reverse proxy on Tailscale hostname):
#   https://lenovoflakes.tail62b305.ts.net:8444/
#
#   Seafile listens on the homelab Docker network only (no host publish).
#   nginx terminates TLS and proxies :8444 → seafile:80.
#   db and redis stay on seafile-internal, unreachable from other stacks.
#
# Collabora (LibreOffice) — after the first start, append to
# ../../data/seafile/shared/seafile/conf/seahub_settings.py and restart:
#   OFFICE_SERVER_TYPE = 'CollaboraOffice'
#   OFFICE_WEB_APP_BASE_URL = 'https://lenovoflakes.tail62b305.ts.net:8448/hosting/discovery'
#
# Start:
#   cd src/seafile && docker compose up -d

services:
  seafile:
    # Track 13.0 patches; a major bump needs the manual upgrade steps in the Seafile manual.
    image: seafileltd/seafile-mc:13.0-latest
    container_name: seafile
    restart: unless-stopped
    # The image ships no internal defaults for these — setup-seafile-mysql.py reads
    # them straight from the environment, so the full upstream set is passed through
    # even where a value only matters for a feature that is switched off.
    environment:
      TIME_ZONE: America/Los_Angeles
      # Public host:port behind nginx — Seafile builds absolute links from these.
      SEAFILE_SERVER_HOSTNAME: lenovoflakes.tail62b305.ts.net:8444
      SEAFILE_SERVER_PROTOCOL: https
      SITE_ROOT: /
      NON_ROOT: "false"
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?Set JWT_PRIVATE_KEY in .env}
      SEAFILE_LOG_TO_STDOUT: "false"
      ENABLE_GO_FILESERVER: "true"
      SEAFILE_MYSQL_DB_HOST: db
      SEAFILE_MYSQL_DB_PORT: 3306
      SEAFILE_MYSQL_DB_USER: ${SEAFILE_MYSQL_DB_USER:-seafile}
      SEAFILE_MYSQL_DB_PASSWORD: ${SEAFILE_MYSQL_DB_PASSWORD:?Set SEAFILE_MYSQL_DB_PASSWORD in .env}
      SEAFILE_MYSQL_DB_CCNET_DB_NAME: ccnet_db
      SEAFILE_MYSQL_DB_SEAFILE_DB_NAME: seafile_db
      SEAFILE_MYSQL_DB_SEAHUB_DB_NAME: seahub_db
      INIT_SEAFILE_MYSQL_ROOT_PASSWORD: ${INIT_SEAFILE_MYSQL_ROOT_PASSWORD:?Set INIT_SEAFILE_MYSQL_ROOT_PASSWORD in .env}
      INIT_SEAFILE_ADMIN_EMAIL: ${INIT_SEAFILE_ADMIN_EMAIL:?Set INIT_SEAFILE_ADMIN_EMAIL in .env}
      INIT_SEAFILE_ADMIN_PASSWORD: ${INIT_SEAFILE_ADMIN_PASSWORD:?Set INIT_SEAFILE_ADMIN_PASSWORD in .env}
      CACHE_PROVIDER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      MEMCACHED_HOST: memcached
      MEMCACHED_PORT: 11211
      # Documents are edited in Collabora (:8448), so the SeaDoc stack is not deployed.
      ENABLE_SEADOC: "false"
      SEADOC_SERVER_URL: https://lenovoflakes.tail62b305.ts.net:8444/sdoc-server
      ENABLE_NOTIFICATION_SERVER: "false"
      INNER_NOTIFICATION_SERVER_URL: http://notification-server:8083
      NOTIFICATION_SERVER_URL: https://lenovoflakes.tail62b305.ts.net:8444/notification
      ENABLE_SEAFILE_AI: "false"
      ENABLE_FACE_RECOGNITION: "false"
      SEAFILE_AI_SERVER_URL: http://seafile-ai:8888
      SEAFILE_AI_SECRET_KEY: ${JWT_PRIVATE_KEY:?Set JWT_PRIVATE_KEY in .env}
      MD_FILE_COUNT_LIMIT: 100000
    volumes:
      - ../../data/seafile/shared:/shared
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - homelab
      - seafile-internal
    labels:
      - com.centurylinklabs.watchtower.enable=true

  db:
    image: mariadb:10.11
    container_name: seafile-db
    restart: unless-stopped
    environment:
      TZ: America/Los_Angeles
      MYSQL_ROOT_PASSWORD: ${INIT_SEAFILE_MYSQL_ROOT_PASSWORD:?Set INIT_SEAFILE_MYSQL_ROOT_PASSWORD in .env}
      MYSQL_LOG_CONSOLE: "true"
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - ../../data/seafile/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "--connect", "--mariadbupgrade", "--innodb_initialized"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - seafile-internal
    labels:
      - com.centurylinklabs.watchtower.enable=true

  redis:
    image: redis:8-alpine
    container_name: seafile-redis
    restart: unless-stopped
    # Cache only — nothing here needs to survive a restart.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    environment:
      TZ: America/Los_Angeles
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - seafile-internal
    labels:
      - com.centurylinklabs.watchtower.enable=true

networks:
  homelab:
    external: true
  seafile-internal:
    name: seafile-internal
