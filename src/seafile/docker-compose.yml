# Seafile CE — files / sync. Dedicated MariaDB lives in this stack
# (seafile-internal only; not on the homelab network).
#
# Fill in before first `docker compose up`:
#   1. cp .env.example .env
#   2. Set MARIADB_ROOT_PASSWORD and SEAFILE_DB_PASSWORD (openssl rand -base64 32)
#   3. JWT_PRIVATE_KEY — pwgen -s 40 1
#   4. INIT_SEAFILE_ADMIN_EMAIL / INIT_SEAFILE_ADMIN_PASSWORD
#
# Layout:
#   /opt/seafile-data           → Seafile shared volume (config + libraries)
#   ../../data/seafile/mariadb  → this stack's MariaDB datadir (read-write)
#
# Access (nginx reverse proxy on Tailscale hostname):
#   https://lenovoflakes.tail62b305.ts.net:8444/
#
# Start:
#   cd src/seafile && docker compose up -d

services:
  db:
    image: mariadb:latest
    container_name: seafile-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: America/Los_Angeles
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-${INIT_SEAFILE_MYSQL_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - ../../data/seafile/mariadb:/var/lib/mysql
    networks:
      - seafile-internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - com.centurylinklabs.watchtower.enable=true

  memcached:
    image: memcached:1.6.29
    container_name: seafile-memcached
    restart: unless-stopped
    entrypoint: memcached -m 256
    networks:
      - seafile-internal
    labels:
      - com.centurylinklabs.watchtower.enable=true

  seafile:
    image: seafileltd/seafile-mc:12.0-latest
    container_name: seafile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      memcached:
        condition: service_started
    environment:
      TIME_ZONE: America/Los_Angeles
      # Dedicated MariaDB in this stack (hostname `db` on seafile-internal).
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: seafile
      DB_PASSWORD: ${SEAFILE_DB_PASSWORD:?Set SEAFILE_DB_PASSWORD in .env}
      DB_ROOT_PASSWD: ${MARIADB_ROOT_PASSWORD:-${INIT_SEAFILE_MYSQL_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}}
      SEAFILE_MYSQL_DB_HOST: db
      SEAFILE_MYSQL_DB_PORT: "3306"
      SEAFILE_MYSQL_DB_USER: seafile
      SEAFILE_MYSQL_DB_PASSWORD: ${SEAFILE_DB_PASSWORD:?Set SEAFILE_DB_PASSWORD in .env}
      SEAFILE_MYSQL_DB_CCNET_DB_NAME: ccnet_db
      SEAFILE_MYSQL_DB_SEAFILE_DB_NAME: seafile_db
      SEAFILE_MYSQL_DB_SEAHUB_DB_NAME: seahub_db
      # Public URL (nginx TLS on :8444)
      SEAFILE_SERVER_HOSTNAME: ${SEAFILE_SERVER_HOSTNAME:-lenovoflakes.tail62b305.ts.net:8444}
      SEAFILE_SERVER_PROTOCOL: https
      SITE_ROOT: /
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?Set JWT_PRIVATE_KEY in .env (pwgen -s 40 1)}
      INIT_SEAFILE_ADMIN_EMAIL: ${INIT_SEAFILE_ADMIN_EMAIL:?Set INIT_SEAFILE_ADMIN_EMAIL in .env}
      INIT_SEAFILE_ADMIN_PASSWORD: ${INIT_SEAFILE_ADMIN_PASSWORD:?Set INIT_SEAFILE_ADMIN_PASSWORD in .env}
      ENABLE_SEADOC: "false"
      SEAFILE_LOG_TO_STDOUT: "true"
      NON_ROOT: "false"
    volumes:
      - /opt/seafile-data:/shared
    networks:
      - homelab
      - seafile-internal
    labels:
      - com.centurylinklabs.watchtower.enable=true

networks:
  homelab:
    external: true
  seafile-internal:
    driver: bridge
