# Collabora Online (CODE) — LibreOffice-based editors for WOPI clients (e.g. Seafile).
# Stateless: no database (unlike ONLYOFFICE).
#
# Fill in before first `docker compose up`:
#   1. cp .env.example .env
#   2. Set PASSWORD (openssl rand -base64 24)
#
# Access (nginx reverse proxy on Tailscale hostname):
#   https://lenovoflakes.tail62b305.ts.net:8448/
#   Admin: https://lenovoflakes.tail62b305.ts.net:8448/browser/dist/admin/admin.html
#
#   Collabora listens on the homelab Docker network only (no host publish).
#   nginx terminates TLS and proxies :8448 → libreoffice:9980.
#
# Seafile (seahub_settings.py on the Seafile volume):
#   OFFICE_SERVER_TYPE = 'CollaboraOffice'
#   OFFICE_WEB_APP_BASE_URL = 'https://lenovoflakes.tail62b305.ts.net:8448/hosting/discovery'
#
# Start:
#   cd src/libreoffice && docker compose up -d

services:
  libreoffice:
    image: collabora/code:latest
    container_name: libreoffice
    restart: unless-stopped
    cap_add:
      - MKNOD
    environment:
      TZ: America/Los_Angeles
      # Public hostname:port of this editor (what browsers hit via nginx).
      server_name: lenovoflakes.tail62b305.ts.net:8448
      # WOPI hosts allowed to open documents here (Seafile public URL).
      aliasgroup1: ${ALIASGROUP1:-https://lenovoflakes.tail62b305.ts.net:8444,https://lenovoflakes\\.tail62b305\\.ts\\.net:8444}
      username: ${USERNAME:-admin}
      password: ${PASSWORD:?Set PASSWORD in .env}
      dictionaries: en_US
      DONT_GEN_SSL_CERT: "true"
      extra_params: --o:ssl.enable=false --o:ssl.termination=true
    networks:
      - homelab
    labels:
      - com.centurylinklabs.watchtower.enable=true

networks:
  homelab:
    external: true
