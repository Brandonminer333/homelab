# Forgejo — self-hosted Git; database is shared MariaDB (src/mariadb).
#
# Prerequisites:
#   1. Shared MariaDB is up and healthy (cd src/mariadb && docker compose up -d)
#   2. FORGEJO_DB_PASSWORD in this .env matches src/mariadb/.env
#
# TODO: switch FORGEJO__database__* from postgres:5432 to mariadb:3306 / mysql.
#
# Fill in before first `docker compose up`:
#   1. cp .env.example .env
#   2. Set FORGEJO_DB_PASSWORD (and optionally Forgejo admin via first-run UI)
#
# Layout:
#   ../../data/forgejo → Forgejo app data, repos, config (read-write)
#
# Access (nginx reverse proxy on Tailscale hostname):
#   https://lenovoflakes.tail62b305.ts.net:8446/
#
#   Forgejo HTTP listens on the homelab Docker network only (no host publish).
#   nginx terminates TLS and proxies :8446 → forgejo:3000.
#
# Git over SSH (direct Tailscale publish, not via nginx):
#   ssh://git@lenovoflakes.tail62b305.ts.net:2222/<user>/<repo>.git
#
# Start (after shared MariaDB):
#   cd src/forgejo && docker compose up -d

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:16.0.1
    container_name: forgejo
    restart: unless-stopped
    environment:
      TZ: America/Los_Angeles
      USER_UID: ${PUID:-1000}
      USER_GID: ${PGID:-1000}
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: postgres:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD: ${FORGEJO_DB_PASSWORD:?Set FORGEJO_DB_PASSWORD in .env}
      FORGEJO__server__DOMAIN: lenovoflakes.tail62b305.ts.net
      FORGEJO__server__SSH_DOMAIN: lenovoflakes.tail62b305.ts.net
      FORGEJO__server__ROOT_URL: https://lenovoflakes.tail62b305.ts.net:8446/
      FORGEJO__server__HTTP_PORT: 3000
      FORGEJO__server__SSH_PORT: 2222
      FORGEJO__server__DISABLE_SSH: "false"
      FORGEJO__server__START_SSH_SERVER: "true"
      # Behind nginx TLS; honor X-Forwarded-* from the proxy.
      FORGEJO__server__PROTOCOL: http
    volumes:
      - ../../data/forgejo:/data
    ports:
      # Git SSH — HTTP goes through nginx on the homelab network
      - "2222:22"
    networks:
      - homelab
    labels:
      - com.centurylinklabs.watchtower.enable=true

networks:
  homelab:
    external: true
