# Forgejo — self-hosted Git with PostgreSQL.
#
# Fill in before first `docker compose up`:
#   1. cp .env.example .env
#   2. Set POSTGRES_PASSWORD (and optionally Forgejo admin via first-run UI)
#
# Layout (host paths under src/forgejo/):
#   ./data     → Forgejo app data, repos, config (read-write)
#   ./postgres → PostgreSQL data (read-write)
#
# Access (nginx reverse proxy on Tailscale hostname):
#   https://lenovoflakes.tail62b305.ts.net:8446/
#
#   Forgejo HTTP listens on the homelab Docker network only (no host publish).
#   nginx terminates TLS and proxies :8446 → forgejo:3000.
#
# Git over SSH (direct Tailscale publish, not via nginx):
#   ssh://git@lenovoflakes.tail62b305.ts.net:2222/<user>/<repo>.git
#
# Start:
#   cd src/forgejo && docker compose up -d

services:
  # Unique service name so it does not collide with nextcloud's `db` on homelab.
  forgejo-db:
    image: postgres:16-alpine
    container_name: forgejo-db
    restart: unless-stopped
    environment:
      TZ: America/Los_Angeles
      POSTGRES_USER: forgejo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: forgejo
      # Subdir so ./postgres/.gitkeep does not block initdb on an empty mount.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./postgres:/var/lib/postgresql/data
    networks:
      - homelab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgejo -d forgejo"]
      interval: 10s
      timeout: 5s
      retries: 5

  forgejo:
    image: codeberg.org/forgejo/forgejo:16.0.1
    container_name: forgejo
    restart: unless-stopped
    depends_on:
      forgejo-db:
        condition: service_healthy
    environment:
      TZ: America/Los_Angeles
      USER_UID: ${PUID:-1000}
      USER_GID: ${PGID:-1000}
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: forgejo-db:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD: ${POSTGRES_PASSWORD}
      FORGEJO__server__DOMAIN: lenovoflakes.tail62b305.ts.net
      FORGEJO__server__SSH_DOMAIN: lenovoflakes.tail62b305.ts.net
      FORGEJO__server__ROOT_URL: https://lenovoflakes.tail62b305.ts.net:8446/
      FORGEJO__server__HTTP_PORT: 3000
      FORGEJO__server__SSH_PORT: 2222
      FORGEJO__server__DISABLE_SSH: "false"
      FORGEJO__server__START_SSH_SERVER: "true"
      # Behind nginx TLS; honor X-Forwarded-* from the proxy.
      FORGEJO__server__PROTOCOL: http
    volumes:
      - ./data:/data
    ports:
      # Git SSH — HTTP goes through nginx on the homelab network
      - "2222:22"
    networks:
      - homelab
    labels:
      - com.centurylinklabs.watchtower.enable=true

networks:
  homelab:
    external: true
