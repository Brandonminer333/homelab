# Jellyfin — bind-mount stack for a headless Ubuntu homelab host.
#
# Fill in before first `docker compose up`:
#   1. PUID / PGID — run `id -u` and `id -g` on the host for the user that will own ./config and ./cache
#   2. Image tag — check https://github.com/jellyfin/jellyfin/releases for the current stable version
#
# Mount points:
#   ./config        → Jellyfin settings, database, metadata (read-write)
#   ./cache         → transcode and image cache (read-write)
#   ./media/music   → music library (read-only)  → /media/music
#   ./media/videos  → video library (read-only) → /media/videos
#
# Access (nginx reverse proxy on Tailscale hostname):
#   https://lenovoflakes.tail62b305.ts.net:8443/
#
#   Jellyfin listens on the homelab Docker network only (no host publish).
#   nginx terminates TLS and proxies :8443 → jellyfin:8096.
#   Leave Base URL empty (root). Set JELLYFIN_PublishedServerUrl to the URL above
#   if clients need an explicit public URL.
#
#   Do NOT use `tailscale funnel` unless you intentionally want public internet
#   exposure. Tailnet access is via MagicDNS + nginx.

services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      # Placeholders — override in a .env file next to this compose file.
      # On the host: id -u <user>  and  id -g <user>
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: America/Los_Angeles
      JELLYFIN_PublishedServerUrl: https://lenovoflakes.tail62b305.ts.net:8443
    volumes:
      - ./config:/config
      - ./cache:/cache
      - ./media/music:/media/music:ro
      - ./media/videos:/media/videos:ro
    networks:
      - homelab
    # Intel QuickSync hardware transcoding (optional):
    # Run `ls -la /dev/dri` on the host first. If renderD128 exists, uncomment the block below and restart.
    # If /dev/dri is missing or empty, leave this commented — Jellyfin will use CPU (software) transcoding.
    # devices:
    #   - /dev/dri:/dev/dri

networks:
  homelab:
    external: true
