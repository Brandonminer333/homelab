# Radicale — CalDAV / CardDAV (calendars & contacts).
#
# Fill in before first `docker compose up`:
#   1. Create a user (bcrypt htpasswd; image includes htpasswd):
#        docker run --rm -it tomsquest/docker-radicale \
#          htpasswd -B -c /dev/stdout YOUR_USERNAME
#      Paste the printed `user:$2y$…` line into config/users (create the file).
#   2. Add more users later with: htpasswd -B config/users OTHER_USER
#
# Layout:
#   ./config             → radicale config + htpasswd users (config ro, users rw for htpasswd)
#   ../../data/radicale  → calendar / contact collections
#
# Access (nginx reverse proxy on Tailscale hostname):
#   https://lenovoflakes.tail62b305.ts.net:8450/
#
#   Radicale listens on the homelab Docker network only (no host publish).
#   nginx terminates TLS and proxies :8450 → radicale:5232.
#
# Clients (Apple Calendar, DAVx⁵, Thunderbird):
#   Server URL:  https://lenovoflakes.tail62b305.ts.net:8450/YOUR_USERNAME/
#   or discover: https://lenovoflakes.tail62b305.ts.net:8450/
#   Username / password: from config/users
#
# Start:
#   cd src/radicale && docker compose up -d

services:
  radicale:
    image: tomsquest/docker-radicale
    container_name: radicale
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - KILL
    environment:
      TZ: America/Los_Angeles
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 50
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5232"]
      interval: 30s
      retries: 3
      start_period: 15s
    volumes:
      - ../../data/radicale:/data
      - ./config:/config:ro
    networks:
      - homelab
    labels:
      - com.centurylinklabs.watchtower.enable=true

networks:
  homelab:
    external: true
