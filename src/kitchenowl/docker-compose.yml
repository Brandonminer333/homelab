# KitchenOwl — shared grocery lists, recipes, and meal planning.
#
# Fill in before first `docker compose up`:
#   1. cp .env.example .env
#   2. Set JWT_SECRET_KEY (see .env.example)
#   3. Leave OPEN_REGISTRATION=true until you create your account, then set false
#
# Layout (DATA_ROOT comes from storage.env at the repo root):
#   $DATA_ROOT/kitchenowl → SQLite DB and uploads (read-write)
#
# Disabled: nginx no longer publishes :8449 or proxies to this container.
# Do not start until the nginx server block and port mapping are restored.
#
# Access (when re-enabled — nginx reverse proxy on Tailscale hostname):
#   https://lenovoflakes.tail62b305.ts.net:8449/
#
#   KitchenOwl listens on the homelab Docker network only (no host publish).
#   nginx terminates TLS and proxies :8449 → kitchenowl:8080.
#
# Clients (KitchenOwl mobile / web):
#   Server URL: https://lenovoflakes.tail62b305.ts.net:8449
#   The first account created via the web UI is the household admin.
#
# Start (only after nginx is wired back up):
#   ./scripts/compose.sh src/kitchenowl up -d
#   (the wrapper adds storage.env; plain `docker compose` cannot resolve DATA_ROOT)

# Image is pinned: v0.7.5+ (Python 3.14, currently `latest`) SIGILLs in
# `flask db upgrade` on this host ("Illegal instruction (core dumped)").
# v0.7.4 is the last release built on Python 3.12. Do not bump to latest
# until the image no longer requires instructions this CPU lacks.
services:
  kitchenowl:
    image: tombursch/kitchenowl:v0.7.4
    container_name: kitchenowl
    restart: unless-stopped
    environment:
      TZ: America/Los_Angeles
      # Must match the public HTTPS URL (CORS / mobile app connectivity).
      FRONT_URL: https://lenovoflakes.tail62b305.ts.net:8449
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      # true for first account; set false in .env after signup and recreate.
      OPEN_REGISTRATION: ${OPEN_REGISTRATION:-true}
    volumes:
      - ${DATA_ROOT:?Set DATA_ROOT in storage.env}/kitchenowl:/data
    networks:
      - homelab
    labels:
      - com.centurylinklabs.watchtower.enable=true

networks:
  homelab:
    external: true
