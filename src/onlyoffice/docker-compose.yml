# ONLYOFFICE Document Server — editors for WOPI clients (e.g. Seafile).
# Database is shared MariaDB (src/mariadb); embedded Postgres is not used.
#
# Prerequisites:
#   1. Shared MariaDB is up and healthy (cd src/mariadb && docker compose up -d)
#   2. ONLYOFFICE_DB_PASSWORD in this .env matches src/mariadb/.env
#
# TODO: switch DB_TYPE/DB_HOST from postgres to mariadb (mysql).
#
# Fill in before first `docker compose up`:
#   1. cp .env.example .env
#   2. Set JWT_SECRET (openssl rand -hex 32) and ONLYOFFICE_DB_PASSWORD
#
# Layout:
#   ../../data/onlyoffice/data → Document Server data / certs (read-write)
#   ../../data/onlyoffice/logs → Document Server logs (read-write)
#   ../../data/onlyoffice/lib  → Document Server lib / cache (read-write)
#
# Access (nginx reverse proxy on Tailscale hostname):
#   https://lenovoflakes.tail62b305.ts.net:8448/
#
#   Document Server listens on the homelab Docker network only (no host publish).
#   nginx terminates TLS and proxies :8448 → onlyoffice:80.
#
# Start (after shared MariaDB):
#   cd src/onlyoffice && docker compose up -d

services:
  onlyoffice:
    image: onlyoffice/documentserver:9.4
    container_name: onlyoffice
    restart: unless-stopped
    environment:
      TZ: America/Los_Angeles
      # Persist JWT across restarts (required for connectors).
      JWT_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_HEADER: Authorization
      JWT_IN_BODY: "false"
      # External shared MariaDB (DB must already exist; see src/mariadb/init).
      # TODO: DB_TYPE/DB_HOST still point at Postgres until this stack is rewired.
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: onlyoffice
      DB_USER: onlyoffice
      DB_PWD: ${ONLYOFFICE_DB_PASSWORD:?Set ONLYOFFICE_DB_PASSWORD in .env}
    volumes:
      - ../../data/onlyoffice/data:/var/www/onlyoffice/Data
      - ../../data/onlyoffice/logs:/var/log/onlyoffice
      - ../../data/onlyoffice/lib:/var/lib/onlyoffice
    networks:
      - homelab
    labels:
      - com.centurylinklabs.watchtower.enable=true

networks:
  homelab:
    external: true
